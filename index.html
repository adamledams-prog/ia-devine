<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devine le Brawler</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">Mini jeu de déduction</p>
      <h1>Devine le <span>Brawler</span></h1>
      <p class="intro">Pense à un brawler connu dans ma liste. Je vais te poser quelques questions pour le retrouver.</p>
      <button class="primary-button" id="start-button">Commencer la partie</button>
    </section>

    <section class="game-panel is-hidden" id="game-panel" aria-live="polite">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Question <span id="question-number">1</span></p>
          <h2 id="question-text">...</h2>
        </div>
        <div class="counter"><strong id="candidate-count">86</strong><span>possibles</span></div>
      </div>
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="answer-grid">
        <button class="answer-button yes" data-answer="yes">Oui</button>
        <button class="answer-button no" data-answer="no">Non</button>
        <button class="answer-button unknown" data-answer="unknown">Je ne sais pas</button>
      </div>
      <button class="text-button" id="restart-button">Recommencer</button>
    </section>

    <section class="result-panel is-hidden" id="result-panel" aria-live="polite">
      <div class="result-icon" id="result-icon">★</div>
      <p class="eyebrow">Mon intuition</p>
      <h2 id="result-title">Tu pensais à...</h2>
      <div class="guess-card" id="guess-card"></div>
      <p class="result-message" id="result-message"></p>
      <div class="result-actions">
        <button class="primary-button" id="play-again-button">Rejouer</button>
        <button class="text-button" id="wrong-button">Ce n’est pas ça</button>
      </div>
    </section>

    <footer>Prototype local · roster de brawlers connu · version 2</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
